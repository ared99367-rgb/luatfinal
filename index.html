LEXA PRO · Ngân sách mục tiêu: mở luật <150 ms; thao tác tìm kiếm <100 ms; cuộn không có tác vụ >50 ms.
GĐ1–GĐ2 hiện thực hệ khung giao diện, dữ liệu, tìm kiếm, thư viện, điều hướng và trình đọc. Kho dữ liệu chỉ hiển thị văn bản đã nạp từ manifest.

THÊM LUẬT DÙNG LÂU DÀI (GitHub Pages):
1. Tạo data/laws/mau-luat.json theo đúng schema bên dưới.
2. Thêm một dòng metadata vào data/manifest.json. Tải từng luật độc lập; một file lỗi không chặn luật khác.
Ví dụ manifest: {"id":"mau-luat","ten":"Luật mẫu","so_hieu":"Minh họa","nam":2025,"linh_vuc":"Mẫu","tinh_trang":"con_hieu_luc","file":"laws/mau-luat.json","phien_ban":"2025","cap_nhat":"2025-01-01"}
Ví dụ data/laws/mau-luat.json:
{"id":"mau-luat","nhom_id":"mau-luat","ten":"Luật mẫu","so_hieu":"Minh họa","nam":2025,"linh_vuc":"Mẫu","co_quan":"Minh họa","ngay_ban_hanh":"Minh họa","ngay_hieu_luc":"Minh họa","tinh_trang":"con_hieu_luc","phien_ban":"2025","cau_truc":[{"loai":"chuong","so":"I","ten":"Quy định chung","dieu":[{"so":1,"ten":"Phạm vi minh họa","khoan":[{"so":1,"noi_dung":"Nội dung minh họa, cần đối chiếu văn bản gốc.","diem":[{"ky_hieu":"a","noi_dung":"Điểm minh họa."}]}]}]}],"lien_quan":[]}

THÊM LUẬT TỪ GIAO DIỆN: GĐ1 hiện chưa có giao diện nhập; tính năng được triển khai ở giai đoạn 2 theo đặc tả.
SchemaVersion dữ liệu ứng dụng: 1. migrate() giữ nguyên dữ liệu cá nhân theo khóa luật/phiên bản.
-->

<script>
/* ==================== Config ==================== */
const Config=(()=>{const DB_NAME='lexa-pro-db',DB_VERSION=1,SCHEMA_VERSION=1;const LS_KEY='lexa-pro-settings';const CALCULATOR_DEFAULTS={heSoK:1,tyLeDat:1,incomeTaxRate:.02,registrationRate:.005};return{DB_NAME,DB_VERSION,SCHEMA_VERSION,LS_KEY,CALCULATOR_DEFAULTS,MAX_RECENT:20,MANIFEST_URL:'data/manifest.json'};})();
/* ==================== Store + EventBus ==================== */
const Store=(()=>{const state={laws:[],lawErrors:[],currentLawId:null,currentArticle:1,openTabs:[],theme:'dark',sidebarOpen:true,panelOpen:true,sideWidth:300,rightWidth:340,fontSize:16,zen:false,source:'system',view:'dashboard',bookmarks:[],recent:[],recentQueries:[],searchFilters:{},viewCounts:{},settings:{}};const listeners=new Map();const EventBus={on(type,fn){if(!listeners.has(type))listeners.set(type,new Set());listeners.get(type).add(fn);return()=>listeners.get(type)?.delete(fn)},emit(type,payload){for(const fn of listeners.get(type)||[])try{fn(payload)}catch(e){console.error('EventBus listener:',e)}}};function set(patch,options={}){Object.assign(state,patch);if(!options.silent)EventBus.emit('change',{patch:{...patch},state})}return{state,set,EventBus};})();
/* ==================== DB (IndexedDB) ==================== */
const DB=(()=>{let dbPromise;function open(){if(!('indexedDB'in window))return Promise.reject(new Error('IndexedDB không được hỗ trợ'));if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(Config.DB_NAME,Config.DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('laws'))d.createObjectStore('laws',{keyPath:'id'});if(!d.objectStoreNames.contains('personal'))d.createObjectStore('personal',{keyPath:'key'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Không mở được IndexedDB'))});return dbPromise}async function request(store,mode,method,value){const d=await open();return new Promise((resolve,reject)=>{const tx=d.transaction(store,mode),os=tx.objectStore(store),req=value===undefined?os[method]():os[method](value);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Lỗi IndexedDB'))})}const get=(s,k)=>request(s,'readonly','get',k),all=s=>request(s,'readonly','getAll'),put=(s,v)=>request(s,'readwrite','put',v),del=(s,k)=>request(s,'readwrite','delete',k);return{open,get,all,put,del}})();
/* ==================== Data ==================== */
const Data=(()=>{
 function validateLaw(l){const errors=[];for(const k of ['id','ten','nam','phien_ban','cau_truc','loai_van_ban'])if(l?.[k]===undefined||l[k]===null||l[k]==='')errors.push(`Thiếu trường bắt buộc: ${k}`);if(l?.id&&!/^[a-z0-9][a-z0-9-]*$/.test(l.id))errors.push('id chỉ gồm chữ thường, số và dấu gạch ngang');if(l?.tinh_trang&&!['con_hieu_luc','het_mot_phan','het_hieu_luc','chua_hieu_luc'].includes(l.tinh_trang))errors.push('tinh_trang không thuộc enum schema');if(l?.cau_truc&&!Array.isArray(l.cau_truc))errors.push('cau_truc phải là mảng');const seen=new Set();for(const ch of l?.cau_truc||[]){if(!Array.isArray(ch.dieu))errors.push(`Chương ${ch.so||'?'} thiếu mảng điều`);for(const art of ch.dieu||[]){const articleKey=art.id||art.so;if(seen.has(articleKey))errors.push(`Khóa Điều trùng: ${articleKey}`);seen.add(articleKey);if(!art.ten||!Array.isArray(art.khoan)||!art.khoan.length)errors.push(`Điều ${art.so||'?'} thiếu tên hoặc khoản`)}}return{valid:errors.length===0,errors}}
 async function migrate(){try{let saved=localStorage.getItem(Config.LS_KEY);if(!saved)return;const parsed=JSON.parse(saved);if((parsed.schemaVersion||0)<Config.SCHEMA_VERSION){parsed.schemaVersion=Config.SCHEMA_VERSION;localStorage.setItem(Config.LS_KEY,JSON.stringify(parsed))}Store.set({settings:parsed,theme:parsed.theme||Store.state.theme,sidebarOpen:parsed.sidebarOpen!==false,panelOpen:parsed.panelOpen!==false,sideWidth:parsed.sideWidth||300,rightWidth:parsed.rightWidth||340,fontSize:parsed.fontSize||16,openTabs:parsed.openTabs||[],currentLawId:parsed.currentLawId||null,currentArticle:parsed.currentArticle||1,bookmarks:parsed.bookmarks||[],recent:parsed.recent||[],recentQueries:parsed.recentQueries||[],searchFilters:parsed.searchFilters||{},hiddenUserLawIds:parsed.hiddenUserLawIds||[],viewCounts:parsed.viewCounts||{}})}catch(e){console.warn('Không đọc được cài đặt đã lưu:',e)}}
 let persistTimer;function persist(){clearTimeout(persistTimer);persistTimer=setTimeout(()=>{const s=Store.state,save={schemaVersion:Config.SCHEMA_VERSION,theme:s.theme,sidebarOpen:s.sidebarOpen,panelOpen:s.panelOpen,sideWidth:s.sideWidth,rightWidth:s.rightWidth,fontSize:s.fontSize,openTabs:s.openTabs,currentLawId:s.currentLawId,currentArticle:s.currentArticle,bookmarks:s.bookmarks,recent:s.recent,recentQueries:s.recentQueries,searchFilters:s.searchFilters,hiddenUserLawIds:s.hiddenUserLawIds||[],viewCounts:s.viewCounts||{}};try{localStorage.setItem(Config.LS_KEY,JSON.stringify(save));UI?.status?.('Đã đồng bộ')}catch(e){UI?.status?.('Không lưu được cài đặt');console.warn('LocalStorage đầy hoặc không khả dụng',e)}},300)}
 async function loadLegalData(){let manifest;try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),5000);const res=await fetch(Config.MANIFEST_URL,{signal:controller.signal,cache:'no-cache'});clearTimeout(timer);if(!res.ok)throw new Error('manifest trả về HTTP '+res.status);manifest=await res.json();if(!manifest||!Array.isArray(manifest.laws))throw new Error('manifest.json cần có mảng laws');const loaded=await Promise.allSettled(manifest.laws.map(async m=>{if(!m.id||!m.file)throw new Error('Thiếu id hoặc file trong manifest');const r=await fetch('data/'+m.file);if(!r.ok)throw new Error('Không tải được '+m.file+' (HTTP '+r.status+')');const doc=await r.json();const v=validateLaw(doc);if(!v.valid)throw new Error(v.errors.join('; '));if(doc.id!==m.id)throw new Error('id trong manifest và tệp luật không khớp');doc.nguon='he_thong';doc.nhom_id=doc.nhom_id||m.nhom_id||m.id;return doc}));const laws=[],lawErrors=[];loaded.forEach((r,i)=>r.status==='fulfilled'?laws.push(r.value):lawErrors.push({meta:manifest.laws[i],reason:r.reason?.message||'Lỗi không xác định'}));return{laws,lawErrors,source:'system'}}catch(e){console.warn('Không tải được dữ liệu pháp luật:',e.message);return{laws:[],lawErrors:[{meta:null,reason:e.message}],source:'system',reason:e.message}}}
 function reconcileReferences(laws){const ids=new Set((laws||[]).map(l=>l.id));const current=ids.has(Store.state.currentLawId)?Store.state.currentLawId:null;const tabs=Store.state.openTabs.filter(id=>ids.has(id));const bookmarks=Store.state.bookmarks.filter(key=>[...ids].some(id=>String(key).startsWith(id+':')));const recent=Store.state.recent.filter(item=>{const id=typeof item==='string'?item:(item?.lawId||item?.id);return !id||ids.has(id)});const searchFilters={...Store.state.searchFilters};if(searchFilters.lawId&&!ids.has(searchFilters.lawId))delete searchFilters.lawId;const view=current?Store.state.view:'dashboard';Store.set({currentLawId:current,openTabs:tabs,bookmarks,recent,searchFilters,view});return{currentLawId:current,openTabs:tabs,bookmarks,recent,searchFilters,view}}
 return{validateLaw,migrate,persist,loadLegalData,reconcileReferences};})();
/* ==================== Search API per-document ==================== */
const Search=(()=>{function addDocument(doc){const i=Store.state.laws.findIndex(x=>x.id===doc.id);if(i>=0){const a=[...Store.state.laws];a[i]=doc;Store.set({laws:a})}else Store.set({laws:[...Store.state.laws,doc]});if(typeof SearchEngine!=='undefined')SearchEngine.addDocument(doc)}function removeDocument(id){Store.set({laws:Store.state.laws.filter(x=>x.id!==id)});if(typeof SearchEngine!=='undefined')SearchEngine.removeDocument(id)}function simple(query){return typeof SearchEngine==='undefined'?[]:SearchEngine.simple(query)}function normalize(s){return String(s).toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').trim()}return{addDocument,removeDocument,simple}})();
/* ==================== Router ==================== */
const Router=(()=>{function go(lawId,article=1,replace=false){const url=lawId?`#/luat/${encodeURIComponent(lawId)}/dieu-${article}`:'#/';if(replace)history.replaceState(null,'',url);else history.pushState(null,'',url);route()}function route(){const match=location.hash.match(/^#\/luat\/([^/]+)\/dieu-([^/]+)/);if(match){const id=decodeURIComponent(match[1]),target=decodeURIComponent(match[2]);const law=Store.state.laws.find(x=>x.id===id),art=Reader.article(law,target);if(law&&art){Store.set({currentLawId:id,currentArticle:art.id||art.so,view:'reader',openTabs:addUnique(Store.state.openTabs,id)});return}if(law&&!Reader.allArticles(law).length&&law.noi_dung_tu_do){Store.set({currentLawId:id,currentArticle:'text',view:'reader',openTabs:addUnique(Store.state.openTabs,id)});return}}Store.set({view:'dashboard'})}function addUnique(a,id){return a.includes(id)?a:[...a,id]}return{go,route}})();
/* ==================== Reader ==================== */
const Reader=(()=>{const el=()=>document.getElementById('readerContent');function allArticles(law){return law?.cau_truc?.flatMap(c=>c.dieu||[])||[]}function article(law,n){return allArticles(law).find(a=>String(a.id||'')===String(n))||allArticles(law).find(a=>Number(a.so)===Number(n))}function render(){const root=el();if(!root)return;const s=Store.state,law=s.laws.find(x=>x.id===s.currentLawId);if(!law){root.innerHTML='';return}const status=statusInfo(law.tinh_trang);root.innerHTML=`<div class="docwrap"><div class="breadcrumb"><button data-action="dashboard" class="outline-label" style="width:auto;padding:0">Thư viện</button><span>›</span><span>${esc(law.ten)}</span><span>›</span><span>Văn bản</span></div><header class="dochead"><div class="doc-kicker">${esc(law.linh_vuc)} · ${esc(String(law.phien_ban||law.nam))}</div><h1 class="doc-title">${esc(law.ten)}</h1><div class="doc-meta"><span>${esc(law.so_hieu)}</span><span>${esc(String(law.nam))}</span><span>${esc(law.co_quan||'Chưa có thông tin')}</span><span class="status ${status.cls}"><i data-lucide="circle-check" width="12"></i>${status.label}</span></div></header>${law.pdf_id?`<div style="margin:10px 0"><button class="softbtn" data-reader-pdf="${esc(law.pdf_id)}">Xem bản PDF gốc</button></div>`:''}${(law.cau_truc||[]).map(ch=>`<h2 class="chapter-title">${ch.so?`CHƯƠNG ${esc(ch.so)}<br>`:''}${esc(ch.ten||'')}</h2>${(ch.dieu||[]).map(a=>`<article class="article" id="article-${esc(a.id||a.so)}" data-article="${esc(a.id||a.so)}" data-article-number="${esc(a.so)}" data-article-id="${esc(a.id||a.so)}"><h3><span class="artnum">Điều ${esc(a.so)}.</span> ${esc(a.ten)} <button class="iconbtn" data-action="bookmark-article" data-article="${a.so}" data-article-id="${esc(a.id||a.so)}" title="Đánh dấu điều" aria-label="Đánh dấu Điều ${esc(a.so)}"><i data-lucide="bookmark" width="14"></i></button></h3>${(a.khoan||[]).map(k=>`<p>${k.so?`<b>${esc(k.so)}.</b> `:''}${esc(k.noi_dung)}</p>${(k.diem||[]).map(d=>`<p style="padding-left:22px"><b>${esc(d.ky_hieu)})</b> ${esc(d.noi_dung)}</p>`).join('')}`).join('')}</article>`).join('')}`).join('')}${law.noi_dung_tu_do?`<section class="free-text" style="white-space:pre-wrap;line-height:1.8;padding:20px 0">${esc(law.noi_dung_tu_do)}</section>`:''}${law.phu_luc?.length?`<section class="appendices"><h2>Phụ lục</h2><nav class="appendix-tabs">${law.phu_luc.map((x,i)=>`<button class="softbtn" data-appendix="${i}">${esc(x.ten||`Phụ lục ${i+1}`)}</button>`).join('')}</nav>${law.phu_luc.map((x,i)=>`<div class="appendix-content" data-appendix-content="${i}" ${i?'hidden':''}><pre style="white-space:pre-wrap;overflow:auto">${esc(x.noi_dung||'')}</pre></div>`).join('')}</section>`:''}${law.chu_thich?.length?`<section class="footnotes"><h2>Chú thích</h2>${law.chu_thich.map((x,i)=>`<p>[${i+1}] ${esc(typeof x==='string'?x:x.noi_dung||'')}</p>`).join('')}</section>`:''}</div>`;if(typeof G3!=='undefined'){G3.linkReferences(root);Virtualization.mount(root);root.querySelectorAll('.article').forEach(G3.restoreArticle)}root.querySelector('[data-reader-pdf]')?.addEventListener('click',e=>PDFVault.openViewer(e.currentTarget.dataset.readerPdf));root.querySelectorAll('[data-appendix]').forEach(b=>b.addEventListener('click',()=>{root.querySelectorAll('[data-appendix-content]').forEach(x=>x.hidden=x.dataset.appendixContent!==b.dataset.appendix)}));if(window.lucide)lucide.createIcons();outline();updateStatus();requestAnimationFrame(()=>{if(s.view==='reader')Virtualization.scrollTo(s.currentArticle)})}
 function outline(){const root=document.getElementById('outline');if(!root)return;const s=Store.state,law=s.laws.find(x=>x.id===s.currentLawId);if(!law){root.innerHTML='<div class="empty">Chọn văn bản để xem mục lục.</div>';return}if(!law.cau_truc?.length&&law.noi_dung_tu_do){root.innerHTML='<div class="empty">Văn bản dạng đoạn tự do, không có mục lục Điều.</div>';return}root.innerHTML=`<input class="quickjump" id="quickJump" aria-label="Nhảy đến điều" placeholder="Nhảy nhanh đến điều…"><div class="outline">${law.cau_truc.map(ch=>`<div class="outline-group"><button class="outline-label" data-toggle="chapter-${ch.so}"><i data-lucide="chevron-down" width="13"></i>CHƯƠNG ${esc(ch.so)} · ${esc(ch.ten)}</button><div class="outline-children" id="chapter-${ch.so}"><div class="outline-inner">${(ch.dieu||[]).map(a=>`<button class="outline-article ${String(a.id||a.so)===String(s.currentArticle)||(!String(s.currentArticle).startsWith('d-')&&Number(a.so)===Number(s.currentArticle))?'active':''}" data-goto-article="${esc(a.id||a.so)}">Điều ${a.so}. ${esc(a.ten)}</button>`).join('')}</div></div></div>`).join('')}</div>`;if(window.lucide)lucide.createIcons()}
 function statusInfo(s){return({'con_hieu_luc':{label:'Còn hiệu lực',cls:''},'het_mot_phan':{label:'Hết hiệu lực một phần',cls:'orange'},'het_hieu_luc':{label:'Hết hiệu lực',cls:'red'},'chua_hieu_luc':{label:'Chưa có hiệu lực',cls:'blue'}})[s]||{label:'Chưa xác định',cls:'orange'}}function updateStatus(){const s=Store.state,law=s.laws.find(x=>x.id===s.currentLawId),art=article(law,s.currentArticle);UI.statusLaw(law?law.ten:'LEXA PRO');UI.statusArticle(art?`Điều ${art.so} / ${allArticles(law).length}`:law?.noi_dung_tu_do?'Văn bản dạng tự do':'Chưa mở điều')}
 function goArticle(n){const law=Store.state.laws.find(x=>x.id===Store.state.currentLawId),art=article(law,n);if(!law||!art)return;const key=art.id||art.so;Store.set({currentArticle:key,view:'reader'});Data.persist();Router.go(law.id,key);if(typeof Virtualization!=='undefined')Virtualization.scrollTo(key);else document.getElementById(`article-${key}`)?.scrollIntoView({behavior:'smooth',block:'start'});outline()}
 return{render,outline,allArticles,article,goArticle,statusInfo,updateStatus}})();
/* ==================== Sidebar ==================== */
/* ==================== GĐ3: Personal workspace ==================== */
const G3=(()=>{let records=new Map(),ready=Promise.resolve(),toolbar,tooltip,selectionRange=null,selectionText='',backStack=[],virtual={};const lawNow=()=>Store.state.laws.find(x=>x.id===Store.state.currentLawId),ver=l=>String(l?.phien_ban||l?.nam||'default'),key=(kind,l,a,s='')=>`${kind}:${l.id}:${ver(l)}:${a}${s?':'+s:''}`,cite=(l,a)=>`Điều ${Reader.article(l,a)?.so||a}, ${l?.ten||''} (${l?.phien_ban||l?.nam||''})`;
 function load(){ready=DB.all('personal').then(rows=>{records=new Map(rows.filter(x=>x.kind==='highlight'||x.kind==='note'||x.kind==='case').map(x=>[x.key,x]));return records}).catch(()=>records)}
 function articleText(article){return [...article.querySelectorAll('p')].map(p=>p.textContent).join('\n')}
 function textOffset(root,node,offset){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let total=0,n;while((n=walker.nextNode())){if(n===node)return total+offset;total+=n.nodeValue.length}return -1}
 function rangeForOffsets(root,start,end){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let pos=0,first,last,fo=0,lo=0,n;while((n=walker.nextNode())){const next=pos+n.nodeValue.length;if(!first&&start>=pos&&start<=next){first=n;fo=start-pos}if(end>=pos&&end<=next){last=n;lo=end-pos;break}pos=next}if(!first||!last)return null;const r=document.createRange();try{r.setStart(first,fo);r.setEnd(last,lo);return r}catch{return null}}
 function wrapRange(range,color,id){if(!range||range.collapsed)return;const root=range.commonAncestorContainer.nodeType===1?range.commonAncestorContainer:range.commonAncestorContainer.parentElement;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode()){const n=walker.currentNode;if(range.intersectsNode(n))nodes.push(n)}nodes.reverse().forEach(n=>{const a=n===range.startContainer?range.startOffset:0,b=n===range.endContainer?range.endOffset:n.nodeValue.length;if(b<=a)return;const part=n.splitText(a),tail=part.splitText(b-a),mark=document.createElement('mark');mark.className='lexa-highlight';mark.dataset.highlightKey=id;mark.style.background=color;part.parentNode.replaceChild(mark,part);mark.append(part);void tail});}
 async function restoreArticle(article){await ready;const law=lawNow();if(!law||!article)return;const no=article.dataset.article;for(const rec of records.values()){if(rec.kind!=='highlight'||rec.lawId!==law.id||rec.version!==ver(law)||String(rec.article)!==String(no))continue;if(article.querySelector(`[data-highlight-key="${CSS.escape(rec.key)}"]`))continue;const r=rangeForOffsets(article,rec.start,rec.end);if(r)wrapRange(r,rec.color||'#fff09a',rec.key)}}

function diffHTML(a,b){const x=(a||'').match(/\S+\s*/g)||[],y=(b||'').match(/\S+\s*/g)||[];if(x.length>600||y.length>600)return`<del>${safe(a)}</del><ins>${safe(b)}</ins>`;const d=Array.from({length:x.length+1},()=>new Uint16Array(y.length+1));for(let i=x.length-1;i>=0;i--)for(let j=y.length-1;j>=0;j--)d[i][j]=x[i]===y[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);let i=0,j=0,out='',tag='';while(i<x.length||j<y.length){let t,v;if(i<x.length&&j<y.length&&x[i]===y[j]){t='span';v=x[i++];j++}else if(j<y.length&&(i===x.length||d[i][j+1]>=d[i+1][j])){t='ins';v=y[j++]}else{t='del';v=x[i++]}if(t!==tag){if(tag)out+=`</${tag}>`;out+=`<${t}>`;tag=t}out+=safe(v)}if(tag)out+=`</${tag}>`;return out}

const Virtualization=(()=>{let root=null,observer=null,raf=0,items=new Map(),height=0,scrollerEl=null;function mount(container){root=container;observer?.disconnect();scrollerEl?.removeEventListener('scroll',schedule);items.clear();const nodes=[...container.querySelectorAll('.article')];if(nodes.length<12)return;const scroller=document.getElementById('reader');scrollerEl=scroller;height=scroller?.clientHeight||700;nodes.forEach(el=>items.set(el.dataset.articleId||el.dataset.article,{el,spacer:null,h:Math.max(el.offsetHeight,180)}));update(true);if('IntersectionObserver'in window){observer=new IntersectionObserver(entries=>entries.forEach(x=>{if(x.isIntersecting){const item=items.get(x.target.dataset.virtualSpacer);if(item)attach(item)}}),{root:scroller,rootMargin:'200% 0px'});items.forEach(x=>{if(x.spacer)observer.observe(x.spacer)})}scroller?.addEventListener('scroll',schedule,{passive:true})}function attach(item){if(!item.spacer?.isConnected)return;item.spacer.replaceWith(item.el);item.spacer=null;G3.restoreArticle(item.el)}function detach(item){if(!item.el.isConnected)return;item.h=Math.max(item.el.offsetHeight,item.h,180);const spacer=document.createElement('div');spacer.className='virtual-spacer';spacer.dataset.virtualSpacer=item.el.dataset.articleId||item.el.dataset.article;spacer.style.height=`${item.h}px`;item.el.replaceWith(spacer);item.spacer=spacer;if(observer)observer.observe(spacer)}function update(initial=false){if(!root)return;const scroller=document.getElementById('reader');if(!scroller)return;const top=scroller.scrollTop,bottom=top+scroller.clientHeight;const reads=[...items.values()].map(x=>({x,top:x.el.isConnected?x.el.offsetTop:x.spacer?.offsetTop||0}));reads.forEach(({x,top:y})=>{const near=y+ x.h>=top-height*2&&y<=bottom+height*2;if(near&&x.spacer)attach(x);else if(!near&&x.el.isConnected)detach(x)});if(initial){const cur=items.get(String(Store.state.currentArticle));if(cur?.spacer)attach(cur)}}function schedule(){if(raf)return;raf=requestAnimat  function renderLibraryList(){const host=document.getElementById('libraryList');if(!host)return;const q=SearchEngine.normalize(document.getElementById('librarySearch')?.value||''),sort=document.getElementById('librarySort')?.value||'name',view=document.getElementById('libraryView')?.value||'list';let laws=Store.state.laws.filter(l=>!q||SearchEngine.normalize(`${l.ten} ${l.linh_vuc} ${l.id}`).includes(q));if(sort==='name')laws.sort((a,b)=>a.ten.localeCompare(b.ten,'vi'));else if(sort==='year')laws.sort((a,b)=>Number(b.nam)-Number(a.nam));else if(sort==='views')laws.sort((a,b)=>(Store.state.viewCounts?.[b.id]||0)-(Store.state.viewCounts?.[a.id]||0));host.innerHTML='';host.style.display=view==='grid'?'grid':'block';host.style.gridTemplateColumns=view==='grid'?'repeat(auto-fit,minmax(220px,1fr))':'';host.style.gap='8px';const groups=sort==='field'?laws.reduce((map,l)=>{const key=l.linh_vuc||'Khác';if(!map.has(key))map.set(key,[]);map.get(key).push(l);return map},new Map()):new Map([['',laws]]);for(const [group,items] of groups){if(group){const heading=document.createElement('h3');heading.className='doc-kicker';heading.textContent=group;host.append(heading)}for(const law of items){const row=document.createElement('div');row.className='lawrow';const open=document.createElement('button');open.dataset.libraryOpen=law.id;open.textContent=`${law.ten} · ${law.phien_ban||law.nam}`;const meta=document.createElement('span');meta.style.cssText='margin-left:auto;color:var(--muted)';meta.textContent=`${law.nguon==='nguoi_dung'?'Người dùng':'Hệ thống'} · ${Reader.allArticles(law).length} điều`;row.append(open,meta);if(law.nguon==='nguoi_dung'){for(const [label,attr] of [['Ẩn','hideLaw'],['Xóa','deleteLaw']]){const action=document.createElement('button');action.className='softbtn';action.dataset[attr]=law.id;action.textContent=label;row.append(action)}}host.append(row)}}if(!laws.length)host.innerHTML='<div class="empty">Không có văn bản khớp bộ lọc.</div>'} function renderHiddenLaws(r const PDFVault=(()=>{let index=null,manifest=null;const root=()=>document.getElementById('overlayRoot'),norm=s=>String(s||'').toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');async function load(){if(index)return index;try{const r=await fetch('data/pdf_index.json',{cache:'no-cache'});if(!r.ok)throw new Error(`pdf_index.json HTTP ${r.status}`);const d=await r.json();if(!d||!Array.isArray(d.pdfs))throw new Error('pdf_index.json cần có mảng pdfs');index=d;try{const m=await fetch('data/manifest.json',{cache:'no-cache'});if(m.ok)manifest=await m.json()}catch{}return index}catch(e){index={pdfs:[]};UI.toast(`Không thể tải Kho PDF: ${e.message}`,'error');return index}}function search(q=''){const value=norm(q);return(index?.pdfs||[]).filter(p=>!value||norm(`${p.tieu_de} ${p.so_hieu} ${p.loai_van_ban} ${p.nam}`).includes(value))}function open(){load().then(()=>render())}function render(){const r=root();if(!r)return;const types=[...new Set((index?.pdfs||[]).map(x=>x.loai_van_ban).filter(Boolean))].sort(),years=[...new Set((index?.pdfs||[]).map(x=>x.nam).filter(Boolean))].sort((a,b)=>b-a);r.innerHTML=`<div class="veil" data-veil><section class="modal" role="dialog" aria-modal="true" aria-label="Kho PDF" style="width:min(900px,calc(100vw - 24px))"><h2>Kho PDF</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="pdfSearch" class="quickjump" placeholder="Tìm tiêu đề, số hiệu, loại, năm"><select id="pdfType" class="quickjump"><option value="">Mọi loại</option>${types.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="pdfYear" class="quickjump"><option value="">Mọi năm</option>${years.map(x=>`<option>${x}</option>`).join('')}</select><select id="pdfSort" class="quickjump"><option value="title">Theo tiêu đề</option><option value="year">Năm mới nhất</option></select></div><div id="pdfResults" style="max-height:60vh;overflow:auto;margin-top:12px"></div><div class="modal-actions"><button class="softbtn" id="pdfVaultClos
